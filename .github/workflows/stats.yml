name: stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rpkarticky is private, so it can't be referenced via `uses: owner/repo@ref`
      # from this public repo. Clone it with a PAT and run it as a local action.
      - uses: actions/checkout@v4
        with:
          repository: roman-petruzela/rpkarticky
          ref: v1
          token: ${{ secrets.STATS_TOKEN }}
          path: .rpkarticky

      - uses: ./.rpkarticky
        with:
          token: ${{ secrets.STATS_TOKEN }}
