<svg xmlns="http://www.w3.org/2000/svg" width="450" height="195" viewBox="0 0 450 195" role="img" aria-label="Most Used Languages">
  <title>Most Used Languages</title>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 600; fill: #7aa2f7; }
    .label { font-size: 14px; font-weight: 600; fill: #c0caf5; }
    .value { font-size: 14px; font-weight: 700; fill: #7dcfff; }
    .small { font-size: 12px; fill: #c0caf5; }
    .muted { font-size: 12px; fill: #565f89; }
    .big { font-size: 34px; font-weight: 700; fill: #bb9af7; }
    .prompt { font-size: 14px; fill: #c0caf5; }
  </style>
  <rect x="0.5" y="0.5" width="449" height="194" rx="6" fill="#1a1b26" stroke="#292e42"/>
  <text x="25" y="38" class="title">Most Used Languages</text>
  <clipPath id="bar"><rect x="25" y="60" width="400" height="8" rx="4"/></clipPath>
  <rect x="25" y="60" width="400" height="8" rx="4" fill="#292e42"/>
  <g clip-path="url(#bar)">
    <rect x="25.00" y="60" width="112.43" height="8" fill="#44a51c"/>
    <rect x="137.43" y="60" width="79.09" height="8" fill="#3572A5"/>
    <rect x="216.52" y="60" width="59.20" height="8" fill="#f1e05a"/>
    <rect x="275.72" y="60" width="52.23" height="8" fill="#4F5D95"/>
    <rect x="327.95" y="60" width="49.97" height="8" fill="#3178c6"/>
    <rect x="377.92" y="60" width="47.08" height="8" fill="#89e051"/>
  </g>
  <circle cx="30" cy="95" r="5" fill="#44a51c"/>
  <text x="42" y="99" class="small">QML <tspan fill="#565f89">28.1%</tspan></text>
  <circle cx="235" cy="95" r="5" fill="#3572A5"/>
  <text x="247" y="99" class="small">Python <tspan fill="#565f89">19.8%</tspan></text>
  <circle cx="30" cy="121" r="5" fill="#f1e05a"/>
  <text x="42" y="125" class="small">JavaScript <tspan fill="#565f89">14.8%</tspan></text>
  <circle cx="235" cy="121" r="5" fill="#4F5D95"/>
  <text x="247" y="125" class="small">PHP <tspan fill="#565f89">13.1%</tspan></text>
  <circle cx="30" cy="147" r="5" fill="#3178c6"/>
  <text x="42" y="151" class="small">TypeScript <tspan fill="#565f89">12.5%</tspan></text>
  <circle cx="235" cy="147" r="5" fill="#89e051"/>
  <text x="247" y="151" class="small">Shell <tspan fill="#565f89">11.8%</tspan></text>
</svg>
